<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctxBar = document.getElementById('miniBarChart').getContext('2d');

  new Chart(ctxBar, {
    type: 'bar',
    data: {
      labels: ['Wood Panels', 'material panels', 'tools', 'Craft Hand','worktop'],
      datasets: [{
        data: [26, 14, 2 , 16, 18,4.5],
        backgroundColor: 'rgb(71 71 255)',
        hoverBackgroundColor: '#4f46e5',
        borderRadius: 8, // حواف دائرية ناعمة للأعمدة
        borderSkipped: false

      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true }
      },
      scales: {
        x: { 
          grid: { display: false },
          ticks: {
            font: { size: 12 },
            color: '#9ca3af'
          }
        },
        y: { display: false } // إخفاء المحور الرأسي لمنع التزاحم
      }
    }
  });
</script>
